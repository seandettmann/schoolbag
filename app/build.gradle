// Schoolbag, the Android app. Plain Java and the Android framework only: no
// libraries. The game's art isn't in this repo: the build expects it in
// src/main/assets/art (see ../tools/art and the README).
plugins {
    id 'com.android.application' version '8.7.3'
}

def keystoreProps = new Properties()
def keystoreFile = file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'io.github.seandettmann.schoolbag'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.seandettmann.schoolbag'
        minSdk 29
        targetSdk 35
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '0.1.0'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}
